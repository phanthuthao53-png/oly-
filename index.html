<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLY Streak</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

body{
  margin:0;
  background:#f1f6fd;
  color:#1e293b;
}

/* HEADER */

header{
  background:#2563eb;
  color:white;
  padding:18px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.streak{
  background:rgba(255,255,255,.2);
  padding:6px 14px;
  border-radius:20px;
  font-weight:600;
}

/* LAYOUT */

.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 15px;
}

.card{
  background:white;
  border-radius:14px;
  padding:22px;
  margin-bottom:25px;
  box-shadow:0 6px 20px rgba(0,0,0,.05);
}

h2{
  margin:0 0 15px;
  color:#2563eb;
}

/* FORM */

.form{
  display:grid;
  grid-template-columns:2fr 1fr 2fr auto;
  gap:10px;
}

.form input{
  padding:10px;
  border-radius:7px;
  border:1px solid #cbd5e1;
}

.form button{
  background:#2563eb;
  color:white;
  border:none;
  padding:10px 18px;
  border-radius:7px;
  cursor:pointer;
}

/* TABLE */

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  text-align:center;
  border-bottom:1px solid #e2e8f0;
}

thead{
  background:#eff6ff;
}

td input{
  width:100%;
  padding:6px;
  border-radius:6px;
  border:1px solid #cbd5e1;
}

/* CHART */

.chart-box{
  height:260px;
}

.chart-btns{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:12px;
}

.chart-btns button{
  border:1px solid #2563eb;
  background:white;
  color:#2563eb;
  padding:5px 14px;
  border-radius:20px;
  cursor:pointer;
}

.chart-btns button.active{
  background:#2563eb;
  color:white;
}

/* PIE */

.pie-wrap{
  width:220px;
  margin:auto;
  position:relative;
}

.pie-text{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
  font-weight:700;
  color:#2563eb;
}

/* JOURNAL */

textarea{
  width:100%;
  height:120px;
  padding:10px;
  border-radius:8px;
  border:1px solid #cbd5e1;
}

.journal-btns{
  margin-top:10px;
  display:flex;
  gap:10px;
}

.journal-btns button{
  background:#2563eb;
  color:white;
  border:none;
  padding:6px 14px;
  border-radius:6px;
  cursor:pointer;
}

select{
  padding:6px;
}

/* FOOTER */

footer{
  text-align:center;
  padding:15px;
  color:#64748b;
}

</style>
</head>

<body>

<header>
<h2>OLY STREAK</h2>
<div class="streak">🔥 <span id="streak">0</span> days</div>
</header>


<div class="container">

<!-- FORM -->
<div class="card">
<h2>Add Task</h2>

<div class="form">

<input id="name" placeholder="Task">
<input id="target" placeholder="Target (100 / 2h / 30m)">
<input id="note" placeholder="Note">

<button onclick="addTask()">Add</button>

</div>
</div>


<!-- TABLE -->
<div class="card">

<h2>Tasks</h2>

<table>

<thead>
<tr>
<th>Task</th>
<th>Target</th>
<th>Actual</th>
<th>Note</th>
<th>Delete</th>
</tr>
</thead>

<tbody id="body"></tbody>

</table>

</div>


<!-- PIE -->

<div class="card">

<h2>Today Completion</h2>

<div class="pie-wrap">

<canvas id="pie"></canvas>

<div class="pie-text">
<span id="percent">0%</span>
</div>

</div>

</div>


<!-- BAR -->

<div class="card">

<h2>Performance</h2>

<div class="chart-btns">
<button onclick="setRange('week')" class="active">Week</button>
<button onclick="setRange('month')">Month</button>
<button onclick="setRange('year')">Year</button>
</div>

<div class="chart-box">
<canvas id="bar"></canvas>
</div>

</div>


<!-- JOURNAL -->

<div class="card">

<h2>Daily Journal</h2>

<textarea id="journal"></textarea>

<div class="journal-btns">

<button onclick="saveJournal()">Save</button>

<select id="history"></select>

<button onclick="loadJournal()">View</button>

</div>

</div>

</div>


<footer>
OLY System © 2026
</footer>


<script>

/* ===== DATA ===== */

let tasks = JSON.parse(localStorage.getItem("tasks"))||[];
let history = JSON.parse(localStorage.getItem("history"))||{};
let range="week";

/* ===== UTILS ===== */

function today(){
  return new Date().toISOString().slice(0,10);
}

function parse(v){

  v=v.toLowerCase();

  if(v.includes("h")) return parseFloat(v)*60;
  if(v.includes("m")) return parseFloat(v);

  return parseFloat(v)||0;
}

/* ===== TASK ===== */

function addTask() {

  const name = document.getElementById("taskName").value.trim();
  const target = document.getElementById("taskTarget").value.trim();
  const note = document.getElementById("taskNote").value.trim();

  if (!name || !target) {
    alert("Please enter task and target");
    return;
  }

  tasks.push({
    id: Date.now(),
    name: name,
    target: target,
    actual: "",
    done: false,
    note: note
  });

  saveTasks();
  render();

  // Reset input
  document.getElementById("taskName").value = "";
  document.getElementById("taskTarget").value = "";
  document.getElementById("taskNote").value = "";
}

function del(id){

  tasks=tasks.filter(t=>t.id!==id);

  save();
}

function edit(id,key,val){

  const t=tasks.find(t=>t.id===id);

  t[key]=val;

  save();
}

function save(){

  localStorage.setItem("tasks",JSON.stringify(tasks));

  render();
}

/* ===== CALC ===== */

function calc(){

  let sum=0,c=0;

  tasks.forEach(t=>{

    let ta=parse(t.target);
    let ac=parse(t.actual);

    if(ta){

      sum+=Math.min(ac/ta*100,100);
      c++;
    }
  });

  return c?sum/c:0;
}

/* ===== STREAK ===== */

function streak(p){

  let s=Number(localStorage.getItem("streak"))||0;
  let last=localStorage.getItem("last")||"";

  const t=today();

  if(last!==t){

    if(p>=70){

      const y=new Date();
      y.setDate(y.getDate()-1);

      const yd=y.toISOString().slice(0,10);

      if(last===yd||!last) s++;
      else s=1;

    }else s=0;

    localStorage.setItem("last",t);
    localStorage.setItem("streak",s);
  }

  streakEl.innerText=s;
}

/* ===== HISTORY ===== */

function saveHistory(p){

  history[today()]=p;

  localStorage.setItem("history",JSON.stringify(history));
}

/* ===== RENDER ===== */

function render(){

  body.innerHTML="";

  tasks.forEach(t=>{

    const tr=document.createElement("tr");

    tr.innerHTML=`

<td>${t.name}</td>

<td>${t.target}</td>

<td>
<input value="${t.actual}"
onchange="edit(${t.id},'actual',this.value)">
</td>

<td>
<input value="${t.note}"
onchange="edit(${t.id},'note',this.value)">
</td>

<td>
<button onclick="del(${t.id})">❌</button>
</td>

`;

    body.appendChild(tr);

  });

  update();
}

/* ===== UPDATE ===== */

function update(){

  const p=calc();

  percent.innerText=p.toFixed(0)+"%";

  streak(p);

  saveHistory(p);

  drawPie(p);
  drawBar();

}

/* ===== PIE ===== */

let pie;

function drawPie(p){

  if(pie) pie.destroy();

  pie=new Chart(pieCtx,{

    type:"doughnut",

    data:{
      datasets:[{
        data:[p,100-p],
        backgroundColor:["#2563eb","#e5e7eb"]
      }]
    },

    options:{
      cutout:"75%",
      plugins:{legend:{display:false}}
    }
  });
}

/* ===== BAR ===== */

let bar;

function days(n){

  const a=[];

  for(let i=n-1;i>=0;i--){

    const d=new Date();
    d.setDate(d.getDate()-i);

    a.push(d.toISOString().slice(0,10));
  }

  return a;
}

function months(){

  const a=[];
  const n=new Date();

  for(let i=11;i>=0;i--){

    const d=new Date(n.getFullYear(),n.getMonth()-i,1);

    a.push(
      d.getFullYear()+"-"+(d.getMonth()+1).toString().padStart(2,"0")
    );
  }

  return a;
}

function drawBar(){

  let labels=[],data=[];

  if(range==="week") labels=days(7);
  if(range==="month") labels=days(30);
  if(range==="year") labels=months();

  if(range!=="year"){

    data=labels.map(d=>history[d]||0);

  }else{

    data=labels.map(m=>{

      let s=0,c=0;

      for(const d in history){

        if(d.startsWith(m)){
          s+=history[d];
          c++;
        }
      }

      return c?s/c:0;
    });
  }

  if(bar) bar.destroy();

  bar=new Chart(barCtx,{

    type:"bar",

    data:{
      labels,
      datasets:[{
        data,
        backgroundColor:"#2563eb",
        borderRadius:6
      }]
    },

    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{y:{min:0,max:100}}
    }
  });
}

function setRange(r){

  range=r;

  document.querySelectorAll(".chart-btns button")
  .forEach(b=>b.classList.remove("active"));

  event.target.classList.add("active");

  drawBar();
}

/* ===== JOURNAL ===== */

function saveJournal(){

  localStorage.setItem(
    "journal_"+today(),
    journal.value
  );

  loadHistory();
}

function loadHistory(){

  historySel.innerHTML="";

  for(let k in localStorage){

    if(k.startsWith("journal_")){

      const d=k.replace("journal_","");

      const o=document.createElement("option");

      o.value=k;
      o.textContent=d;

      historySel.appendChild(o);
    }
  }
}

function loadJournal(){

  const k=historySel.value;

  journal.value=
    localStorage.getItem(k)||"";
}

/* ===== INIT ===== */

const body=document.getElementById("body");
const streakEl=document.getElementById("streak");
const pieCtx=document.getElementById("pie");
const barCtx=document.getElementById("bar");

const journal=document.getElementById("journal");
const historySel=document.getElementById("history");

function init(){

  streakEl.innerText=
    localStorage.getItem("streak")||0;

  journal.value=
    localStorage.getItem("journal_"+today())||"";

  loadHistory();

  render();
}

init();

</script>

</body>
</html>
